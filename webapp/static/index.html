<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --fg: var(--tg-theme-text-color, #e7e9ee);
      --muted: var(--tg-theme-hint-color, #8a93a3);
      --card: #161a22;
      --border: #252b36;
      --accent: var(--tg-theme-button-color, #2ea6ff);
      --accent-fg: var(--tg-theme-button-text-color, #ffffff);
      --danger: #ff5b5b;
      --ok: #31c48d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 4px 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0e1219; color: var(--fg); font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #0e1219; color: var(--fg); cursor: pointer; }
    .seg button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: 0; font-weight: 600;
      background: var(--accent); color: var(--accent-fg); cursor: pointer; margin-top: 6px; }
    .btn.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .muted { color: var(--muted); font-size: 12px; }
    .out { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .pill.BUY { background: rgba(49,196,141,.15); color: var(--ok); }
    .pill.SELL { background: rgba(255,91,91,.15); color: var(--danger); }
    .pill.HOLD { background: rgba(138,147,163,.2); color: var(--muted); }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Trading form</h1>

  <div class="card">
    <label>Mode</label>
    <div class="seg" id="mode-seg">
      <button type="button" data-v="analyze" class="on">Analyze</button>
      <button type="button" data-v="auto_trade">Auto-trade</button>
    </div>

    <div class="row">
      <div>
        <label>Exchange</label>
        <select id="exchange">
          <option value="binance">Binance</option>
          <option value="bybit">Bybit</option>
          <option value="okx">OKX</option>
          <option value="kraken">Kraken</option>
          <option value="kucoin">KuCoin</option>
        </select>
      </div>
      <div>
        <label>Symbol</label>
        <input id="symbol" value="BTC/USDT" placeholder="BTC/USDT" />
      </div>
    </div>

    <div class="row-3">
      <div>
        <label>Timeframe</label>
        <select id="timeframe">
          <option>1m</option><option>5m</option><option>15m</option>
          <option selected>1h</option><option>4h</option><option>1d</option>
        </select>
      </div>
      <div>
        <label>Strategy</label>
        <select id="strategy">
          <option value="rsi_ema" selected>RSI + EMA cross</option>
          <option value="rsi">RSI only</option>
          <option value="ema_cross">EMA cross only</option>
        </select>
      </div>
      <div>
        <label>Side</label>
        <select id="side">
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card" id="trade-card">
    <label>Amount (base asset, e.g. BTC)</label>
    <input id="amount" type="number" step="any" min="0" value="0.001" />

    <div class="row">
      <div>
        <label>Stop-loss %</label>
        <input id="sl" type="number" step="any" min="0" max="100" value="1.5" />
      </div>
      <div>
        <label>Take-profit %</label>
        <input id="tp" type="number" step="any" min="0" max="100" value="3" />
      </div>
    </div>

    <label>API key (optional; overrides server default)</label>
    <input id="api_key" placeholder="exchange API key" autocomplete="off" />

    <label>API secret</label>
    <input id="api_secret" type="password" placeholder="exchange API secret" autocomplete="off" />

    <label style="display:flex; align-items:center; gap:8px; margin-top:12px;">
      <input id="testnet" type="checkbox" checked style="width:auto;" />
      <span>Use exchange testnet / sandbox</span>
    </label>
    <div class="muted">Strongly recommended while you're testing.</div>
  </div>

  <button class="btn" id="submit">Run</button>
  <button class="btn secondary" id="close" type="button">Close</button>

  <div class="card hidden" id="result">
    <div id="summary"></div>
    <details style="margin-top:10px;">
      <summary class="muted">Raw response</summary>
      <pre class="out" id="raw"></pre>
    </details>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const $ = (id) => document.getElementById(id);
  let mode = "analyze";

  // Segmented control
  document.querySelectorAll("#mode-seg button").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#mode-seg button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      mode = b.dataset.v;
      $("trade-card").classList.toggle("hidden", mode === "analyze");
      $("submit").textContent = mode === "analyze" ? "Analyze" : "Analyze & place order";
    });
  });

  $("close").addEventListener("click", () => tg?.close?.());

  $("submit").addEventListener("click", async () => {
    const body = {
      mode,
      exchange: $("exchange").value,
      symbol: $("symbol").value.trim().toUpperCase(),
      timeframe: $("timeframe").value,
      strategy: $("strategy").value,
      side: $("side").value,
      amount: parseFloat($("amount").value || "0"),
      stop_loss_pct: parseFloat($("sl").value || "0") || null,
      take_profit_pct: parseFloat($("tp").value || "0") || null,
      api_key: $("api_key").value || null,
      api_secret: $("api_secret").value || null,
      testnet: $("testnet").checked,
      init_data: tg?.initData || null,
    };

    $("submit").disabled = true;
    $("submit").textContent = "Working…";

    try {
      const r = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      renderResult(r.ok, data);

      // Also send a compact summary back to the bot chat, if opened from Telegram.
      if (tg?.sendData) {
        tg.sendData(JSON.stringify({
          mode,
          symbol: body.symbol,
          timeframe: body.timeframe,
          signal: data?.analysis?.signal || "ERR",
          trade_ok: data?.trade?.ok ?? null,
        }));
      }
    } catch (e) {
      renderResult(false, { detail: String(e) });
    } finally {
      $("submit").disabled = false;
      $("submit").textContent = mode === "analyze" ? "Analyze" : "Analyze & place order";
    }
  });

  function renderResult(ok, data) {
    $("result").classList.remove("hidden");
    $("raw").textContent = JSON.stringify(data, null, 2);
    const a = data.analysis;
    if (!ok || !a) {
      $("summary").innerHTML = `<b style="color:var(--danger)">Error:</b> ${data.detail || "request failed"}`;
      return;
    }
    const pill = `<span class="pill ${a.signal}">${a.signal}</span>`;
    let html = `
      <div><b>${a.symbol}</b> · ${a.timeframe} · last <b>${a.last_price}</b></div>
      <div class="muted" style="margin:6px 0;">RSI ${a.rsi} · EMA ${a.ema_fast} / ${a.ema_slow}</div>
      <div>${pill} <span class="muted">${a.reason}</span></div>`;
    if (data.trade) {
      const t = data.trade;
      html += `<hr style="border-color:var(--border); margin:12px 0;">
        <div><b>Trade:</b> ${t.ok ? "placed" : "failed"} — ${t.message || ""}</div>`;
    }
    $("summary").innerHTML = html;
  }
</script>
</body>
</html>
